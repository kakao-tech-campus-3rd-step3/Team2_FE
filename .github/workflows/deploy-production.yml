name: Deploy Pull-it Frontend to Yeon Pi
on:
  workflow_dispatch:
    inputs:
      operation:
        description: preflight은 Pi에 쓰지 않고 전송 경로만 검증합니다.
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy]
  push:
    branches: [develop]
    paths:
      [
        src/**,
        public/**,
        package.json,
        pnpm-lock.yaml,
        index.html,
        .env.example,
        vite.config.ts,
        tsconfig*.json,
        ops/production/**,
        .github/actions/**,
        .github/workflows/deploy-production.yml,
      ]
permissions: { contents: read }
concurrency: { group: pullit-frontend-production, cancel-in-progress: false }
jobs:
  transport-preflight:
    runs-on: ubuntu-latest
    environment: pullit-frontend-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: ./.github/actions/install-cloudflared
      - name: Verify Cloudflare Access and the restricted Pi command path
        env:
          DEPLOY_KEY: ${{ secrets.PULLIT_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PULLIT_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          required=(DEPLOY_KEY KNOWN_HOSTS DEPLOY_HOST PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET)
          for name in "${required[@]}"; do test -n "${!name}"; done
          case "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" in 'CF-Access-Client-Id:'*) exit 1 ;; esac
          case "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET" in 'CF-Access-Client-Secret:'*) exit 1 ;; esac
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --header "CF-Access-Client-Id: $PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET" "https://$DEPLOY_HOST")"
          test "$status" = 200 || { echo "Cloudflare Access service-token probe returned HTTP $status" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host %s\n' "$DEPLOY_HOST" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" --service-token-secret "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET"
          EOF
          chmod 600 ~/.ssh/config
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "pullit-deploy@$DEPLOY_HOST" \
            'test -d /opt/pullit/incoming && test -w /opt/pullit/incoming && sudo -n -l /usr/local/sbin/pullit-deploy >/dev/null'
  build:
    needs: transport-preflight
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_PUBLIC_BASE_PATH: /pull-it/
          VITE_API_BASE_URL: /pull-it
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      - run: ops/production/verify-frontend-bundle.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pullit-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: [transport-preflight, build]
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: pullit-frontend-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: pullit-frontend-${{ github.sha }}
          path: dist
      - run: ops/production/verify-frontend-bundle.sh dist
      - uses: ./.github/actions/install-cloudflared
      - name: Configure dedicated Pi deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.PULLIT_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PULLIT_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host %s\n' "$DEPLOY_HOST" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" --service-token-secret "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET"
          EOF
          chmod 600 ~/.ssh/config
      - name: Upload and activate only this frontend revision
        env:
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" && test -n "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET"
          ssh_opts=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20)
          ssh "${ssh_opts[@]}" "pullit-deploy@$DEPLOY_HOST" "mkdir -p /opt/pullit/incoming/frontend/${{ github.sha }}"
          scp "${ssh_opts[@]}" -r dist "pullit-deploy@$DEPLOY_HOST:/opt/pullit/incoming/frontend/${{ github.sha }}/"
          ssh "${ssh_opts[@]}" "pullit-deploy@$DEPLOY_HOST" "sudo /usr/local/sbin/pullit-deploy frontend ${{ github.sha }}"
